[package]
name = "polpettone-pomodoro-timer"
version = "0.3.1"
edition = "2021"

[workspace]
members = [
    ".",
    "frontend",
]


[dependencies]
structopt = "0.3.26"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8.19"
tempfile = "3.3"
comfy-table = "7.1.3"
serde_json = "1.0.64"
dialoguer = "0.11.0"
dirs = "5.0.1"
home = "0.5.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
rand = "0.9.2"
shell-words = "1.1.0"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
nannou = "0.19"
once_cell = "1.20"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "macros"] }
dotenvy = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
bcrypt = "0.15"

[dev-dependencies]
axum-test = "16.0"
tower = { version = "0.4", features = ["util"] }
