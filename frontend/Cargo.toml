[package]
name = "polpettone-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlElement", "KeyboardEvent", "Window", "Storage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
console_error_panic_hook = "0.1.7"
